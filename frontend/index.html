<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpresoFast - Iniciar Sesión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>ExpresoFast</h1>
        <p>Consola Web de Operación Logística</p>
    </header>

    <main>
        <section class="login-section">
            <h2>Acceso al Sistema</h2>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Usuario:</label>
                    <input type="text" id="username" name="username" required aria-required="true">
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required aria-required="true">
                </div>

                <div id="errorMessage" class="error-message" aria-live="polite"></div>

                <button type="submit">Ingresar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ExpresoFast Logística. Todos los derechos reservados.</p>
    </footer>


    <script src="app.js"></script>
</body>
</html>
