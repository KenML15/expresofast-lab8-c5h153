<div class="login-page">
  <div class="login-box">
    <div class="logo">Expreso<span>Fast</span></div>
    <h2 style="margin-bottom: 1.5rem;">Iniciar Sesión</h2>

    <form (ngSubmit)="iniciarSesion()">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" [(ngModel)]="username" required placeholder="admin">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" [(ngModel)]="password" required placeholder="••••••••">
      </div>
      
      @if (errorMessage()) {
        <p class="login-error" role="alert" style="color: #fca5a5; margin-bottom: 1rem;">{{ errorMessage() }}</p>
      }

      <button type="submit" class="btn-submit" [disabled]="enviando()">{{ enviando() ? 'Ingresando…' : 'Ingresar' }}</button>
    </form>
  </div>
</div>
